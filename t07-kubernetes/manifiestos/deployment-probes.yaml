apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: 2048-app
  name: 2048-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: 2048-app
  template:
    metadata:
      labels:
        app: 2048-app
    spec:
      containers:
      - image: evilroot/docker-2048
        name: docker-2048
        ports:
        - containerPort: 80
        readinessProbe:          # listo para recibir trafico; si falla, sale del balanceo
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:           # sigue vivo; si falla, Kubernetes reinicia el contenedor
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
